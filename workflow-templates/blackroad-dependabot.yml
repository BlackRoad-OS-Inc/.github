name: BlackRoad Dependabot Auto-merge
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge-minor:
    if: github.actor == 'dependabot[bot]'
    runs-on: [self-hosted, blackroad]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Auto-approve minor updates
        run: echo "Dependabot PR detected — review required"
