name: Google Drive Sync

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: [self-hosted, pi]
    steps:
      - name: Sync from Google Drive
        run: |
          rclone sync "gdrive-blackroad:BlackRoad OS, Inc." ~/blackroad-gdrive-sync/ \
            --exclude ".git/**" --transfers 2 2>/dev/null || echo "rclone not configured"
          
      - name: Sync to Google Drive
        run: |
          rclone sync ~/blackroad-operator/docs/ "gdrive-blackroad:BlackRoad OS, Inc./04 - Product & Engineering/06 - Tech Docs (Non-GitHub)/" \
            --exclude ".git/**" --transfers 2 2>/dev/null || echo "rclone not configured"
