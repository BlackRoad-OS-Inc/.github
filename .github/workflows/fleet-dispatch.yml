name: Fleet Dispatch
on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Command to run on fleet'
        required: false
        default: 'status'
      target:
        description: 'Target runner (all, pi, droplet, or specific name)'
        required: false
        default: 'all'
  repository_dispatch:
    types: [fleet-dispatch]

jobs:
  octavia:
    if: >-
      github.event_name == 'repository_dispatch' ||
      contains(fromJSON('["all", "pi", "octavia"]'), github.event.inputs.target)
    runs-on: [self-hosted, octavia]
    steps:
      # No checkout needed for fleet commands
      - name: Run on Octavia
        run: |
          echo "::group::Node Info"
          hostname && uname -a && echo "IP: $(hostname -I | awk '{print $1}')"
          echo "::endgroup::"
          CMD="${{ github.event.inputs.command || github.event.client_payload.command || 'status' }}"
          echo "Running: $CMD"
          if [ "$CMD" = "status" ]; then
            echo "Disk:" && df -h / | tail -1
            echo "Memory:" && free -h | head -2
            echo "Docker:" && docker ps --format 'table {{.Names}}\t{{.Status}}' 2>/dev/null || echo "no docker"
            echo "Gitea:" && curl -s http://localhost:3100/api/v1/version 2>/dev/null || echo "not running"
          elif [ "$CMD" = "deploy" ]; then
            echo "Pulling latest..." && git pull origin main 2>/dev/null || true
            echo "Deployed on octavia"
          elif [ "$CMD" = "sync" ]; then
            cd ~/blackroad-operator 2>/dev/null && git pull origin main 2>/dev/null || true
            echo "Synced operator on octavia"
          else
            eval "$CMD"
          fi

  lucidia:
    if: >-
      github.event_name == 'repository_dispatch' ||
      contains(fromJSON('["all", "pi", "lucidia"]'), github.event.inputs.target)
    runs-on: [self-hosted, lucidia]
    steps:
      # No checkout needed for fleet commands
      - name: Run on Lucidia
        run: |
          echo "::group::Node Info"
          hostname && uname -a && echo "IP: $(hostname -I | awk '{print $1}')"
          echo "::endgroup::"
          CMD="${{ github.event.inputs.command || github.event.client_payload.command || 'status' }}"
          echo "Running: $CMD"
          if [ "$CMD" = "status" ]; then
            echo "Disk:" && df -h / | tail -1
            echo "Memory:" && free -h | head -2
            echo "Ollama:" && curl -s http://localhost:11434/api/tags 2>/dev/null | python3 -c "import json,sys; d=json.load(sys.stdin); print(f'{len(d.get(\"models\",[]))} models')" 2>/dev/null || echo "not running"
            echo "Nginx sites:" && ls /etc/nginx/sites-enabled/ 2>/dev/null | wc -l
          elif [ "$CMD" = "deploy" ]; then
            echo "Pulling latest..." && git pull origin main 2>/dev/null || true
            echo "Deployed on lucidia"
          elif [ "$CMD" = "sync" ]; then
            cd ~/blackroad-operator 2>/dev/null && git pull origin main 2>/dev/null || true
            echo "Synced operator on lucidia"
          else
            eval "$CMD"
          fi

  gematria:
    if: >-
      github.event_name == 'repository_dispatch' ||
      contains(fromJSON('["all", "droplet", "gematria"]'), github.event.inputs.target)
    runs-on: [self-hosted, gematria]
    steps:
      # No checkout needed for fleet commands
      - name: Run on Gematria
        run: |
          echo "::group::Node Info"
          hostname && uname -a && echo "IP: $(hostname -I | awk '{print $1}')"
          echo "::endgroup::"
          CMD="${{ github.event.inputs.command || github.event.client_payload.command || 'status' }}"
          echo "Running: $CMD"
          if [ "$CMD" = "status" ]; then
            echo "Disk:" && df -h / | tail -1
            echo "Memory:" && free -h | head -2
            echo "Caddy domains:" && caddy list-modules 2>/dev/null | head -5 || echo "checking caddy..."
            echo "Ollama:" && curl -s http://localhost:11434/api/tags 2>/dev/null | python3 -c "import json,sys; d=json.load(sys.stdin); print(f'{len(d.get(\"models\",[]))} models')" 2>/dev/null || echo "not running"
          elif [ "$CMD" = "deploy" ]; then
            echo "Pulling latest..." && git pull origin main 2>/dev/null || true
            echo "Deployed on gematria"
          elif [ "$CMD" = "sync" ]; then
            cd ~/blackroad-operator 2>/dev/null && git pull origin main 2>/dev/null || true
            echo "Synced operator on gematria"
          else
            eval "$CMD"
          fi

  anastasia:
    if: >-
      github.event_name == 'repository_dispatch' ||
      contains(fromJSON('["all", "droplet", "anastasia"]'), github.event.inputs.target)
    runs-on: [self-hosted, anastasia]
    steps:
      # No checkout needed for fleet commands
      - name: Run on Anastasia
        run: |
          echo "::group::Node Info"
          hostname && uname -a && echo "IP: $(hostname -I | awk '{print $1}')"
          echo "::endgroup::"
          CMD="${{ github.event.inputs.command || github.event.client_payload.command || 'status' }}"
          echo "Running: $CMD"
          if [ "$CMD" = "status" ]; then
            echo "Disk:" && df -h / | tail -1
            echo "Memory:" && free -h | head -2
          elif [ "$CMD" = "deploy" ]; then
            echo "Pulling latest..." && git pull origin main 2>/dev/null || true
            echo "Deployed on anastasia"
          elif [ "$CMD" = "sync" ]; then
            cd ~/blackroad-operator 2>/dev/null && git pull origin main 2>/dev/null || true
            echo "Synced operator on anastasia"
          else
            eval "$CMD"
          fi
