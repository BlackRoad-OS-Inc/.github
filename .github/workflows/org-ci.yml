name: BlackRoad OS CI
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check for secrets
        run: |
          PATTERNS='sk_live|sk_test|ghp_|gho_|github_pat_|AKIA[0-9A-Z]{16}|-----BEGIN.*PRIVATE KEY|-----BEGIN RSA|-----BEGIN EC|-----BEGIN DSA'
          FILETYPES='--include=*.js --include=*.ts --include=*.py --include=*.sh --include=*.env --include=*.json --include=*.yml --include=*.yaml --include=*.toml --include=*.go --include=*.rb --include=*.php'
          if grep -rE "$PATTERNS" $FILETYPES . 2>/dev/null; then
            echo "::error::Potential secret detected in source files"
            exit 1
          fi
          echo "No hardcoded secrets found"

      - name: Validate AGENTS.md exists
        run: |
          if [ -f "AGENTS.md" ]; then
            echo "AGENTS.md present"
          else
            echo "::warning::AGENTS.md missing — consider adding it"
          fi

      - name: Validate YAML syntax
        run: |
          find . -name '*.yml' -o -name '*.yaml' | while read -r f; do
            python3 -c "import yaml; yaml.safe_load(open('$f'))" 2>/dev/null || \
              echo "::warning::Invalid YAML: $f"
          done
