# Auto-merges PRs from trusted bots/Copilot after required checks pass
name: Auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: Enable auto-merge
    runs-on: ubuntu-latest
    steps:
      # actions/github-script@v7.1.0 — SHA: f28e40c7f34bde8b3046d885e986cb6290c5673b
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.info('No PR in context, skipping.');
              return;
            }

            // Enable GitHub's native auto-merge so the PR merges automatically
            // once all required status checks pass (requires branch protection rules).
            const mutation = `
              mutation EnableAutoMerge($pullRequestId: ID!, $mergeMethod: PullRequestMergeMethod!) {
                enablePullRequestAutoMerge(input: {
                  pullRequestId: $pullRequestId,
                  mergeMethod: $mergeMethod
                }) {
                  pullRequest {
                    autoMergeRequest {
                      enabledAt
                    }
                  }
                }
              }
            `;
            try {
              await github.graphql(mutation, {
                pullRequestId: pr.node_id,
                mergeMethod: 'SQUASH',
              });
              core.info(`✅ Auto-merge enabled for PR #${pr.number}`);
            } catch (err) {
              // Auto-merge requires branch protection rules to be configured.
              // Log and continue — this is non-fatal.
              core.info(`ℹ️ Auto-merge not available for PR #${pr.number}: ${err.message}`);
            }
